<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spike or Subthreshold? Bioelectricity Quiz</title>
<style>
:root{--bg:#F1F6F7;--card:#fff;--ink:#0E1F2B;--mute:#51636F;--line:#C9D7DC;--blue:#1F6F8B;--amber:#D9781A;--ok:#1F8A5B;--bad:#C63D4A;--okbg:#E2F4EB;--badbg:#FBE7E9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A24;--card:#122A38;--ink:#E8F1F4;--mute:#9DB3BE;--line:#24404F;--blue:#5BB4D1;--amber:#F2A541;--ok:#4CC38A;--bad:#F07A85;--okbg:#123B2D;--badbg:#3F1D24}}
:root[data-theme="dark"]{--bg:#0B1A24;--card:#122A38;--ink:#E8F1F4;--mute:#9DB3BE;--line:#24404F;--blue:#5BB4D1;--amber:#F2A541;--ok:#4CC38A;--bad:#F07A85;--okbg:#123B2D;--badbg:#3F1D24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:clamp(2rem,9vw,3rem);line-height:1.02;font-weight:800;margin:8px 0 12px;letter-spacing:-.02em}
h2{font-size:1.3rem;line-height:1.3;font-weight:600;margin:0 0 16px}
p{margin:0 0 14px;color:var(--mute)}
.strip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 6px;margin-bottom:18px}
.strip svg{display:block;width:100%;height:auto}
.strip .base{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.strip .tr{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);margin-top:2px}
.opts{display:grid;gap:10px;margin:0 0 16px}
.opt,.btn{font:inherit;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 15px;min-height:52px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.55}
.btn{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;font-weight:600}
.fb{border-radius:12px;padding:13px 15px;margin-bottom:14px;background:var(--card);border:1px solid var(--line)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb span{color:var(--mute);font-size:.96rem}
.hidden{display:none}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--bad)}
.dots i.o{background:var(--ok)}
.big{font-size:3.4rem;font-weight:800;line-height:1;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.tr{transition:d .3s}.spark{animation:pop .5s}@keyframes pop{from{transform:scale(.96)}to{transform:none}}}
</style>
</head>
<body>
<main>
<section id="intro">
  <h1>Spike or Subthreshold?</h1>
  <p>12 questions on membrane and action potentials. Every right answer fires a spike on your trace; every miss dips below rest. About 5 minutes, no sign-up.</p>
  <div class="strip"><svg viewBox="0 0 360 60" aria-hidden="true"><line class="base" x1="0" y1="40" x2="360" y2="40"/><polyline class="tr" points="0,40 110,40 116,40 119,4 124,44 128,48 134,40 360,40"/></svg></div>
  <button class="btn" id="go">Start the quiz</button>
  <p style="margin-top:18px;font-size:.9rem;text-align:center"><a href="/present.html" style="color:var(--blue)">Lecturer? Show the QR code for the class</a></p>
</section>

<section id="quiz" class="hidden">
  <div class="strip"><svg viewBox="0 0 360 60" role="img" aria-label="Your progress trace"><line class="base" x1="0" y1="40" x2="360" y2="40"/><polyline class="tr" id="tr" points="0,40"/></svg>
    <div class="meta"><span id="cnt"></span><span id="stk"></span></div></div>
  <h2 id="q" tabindex="-1"></h2>
  <div class="opts" id="opts"></div>
  <div id="fb" class="fb hidden" aria-live="polite"></div>
  <button class="btn hidden" id="next">Next question</button>
</section>

<section id="end" class="hidden">
  <div class="strip"><svg viewBox="0 0 360 60" aria-hidden="true"><line class="base" x1="0" y1="40" x2="360" y2="40"/><polyline class="tr" id="tr2" points="0,40"/></svg></div>
  <div class="big spark" id="sc"></div>
  <h2 id="ti"></h2>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="btn" id="again">Try again (options reshuffle)</button>
</section>
</main>
<script>
const Q=[
["What carries charge in biological systems, unlike man-made circuits?","Ions moving in an electrolyte across cell membranes",["Electrons moving freely through a metallic conductor","Protons moving through lipid insulation layers","Photons crossing specialized protein channels"],"Mobile ions (Na⁺, K⁺, Ca²⁺, Cl⁻) in aqueous electrolyte carry current through selective channels. Wires rely on free electrons."],
["At rest, how does K⁺ permeability compare with Na⁺ permeability?","PK is 50–100× larger than PNa",["PK equals PNa","PNa is 50–100× larger than PK","The membrane is impermeable to both at rest"],"Leak channels make the resting membrane far more permeable to K⁺, which pulls Vrest toward the K⁺ Nernst potential (about −90 mV)."],
["Which mechanism uses ATP to maintain ionic gradients?","The Na⁺–K⁺ pump",["Voltage-gated Na⁺ channels","Passive K⁺ leak channels","Bicarbonate diffusion exchangers"],"The Na⁺–K⁺ ATPase is a primary active transporter that works against steep chemical gradients."],
["What is the Na⁺–K⁺ pump's transport ratio per cycle?","3 Na⁺ out, 2 K⁺ in",["2 Na⁺ out, 3 K⁺ in","3 Na⁺ in, 2 K⁺ out","1 Na⁺ out, 1 K⁺ in"],"Moving 3 positive charges out for 2 in makes the pump electrogenic, adding a little to internal negativity."],
["When is a cell in Nernst equilibrium for an ion?","The electrical force balances the concentration-gradient force, so net flux is zero",["All passive channels close permanently","Inside and outside concentrations are equal","Membrane capacitance drops to zero"],"Equilibrium means the voltage across the membrane exactly opposes diffusion. Concentrations are not equal; the fluxes cancel."],
["Which ion movement drives rapid depolarization?","Na⁺ influx",["K⁺ efflux","Ca²⁺ influx into the cytosol","Cl⁻ efflux"],"At threshold, voltage-gated Na⁺ channels open and Na⁺ rushes in down its electrochemical gradient."],
["How does myelination change conduction?","It cuts leakage and speeds conduction about 20×",["It slows conduction by raising capacitance","It changes the peak amplitude of each spike","It permanently prevents repolarization"],"Myelin insulates the axon, lowering capacitance and leakage, so the impulse jumps between nodes of Ranvier (saltatory conduction)."],
["How does a cardiac action potential compare with a nerve spike?","Cardiac has a 200–300 ms plateau; nerve spikes last about 2 ms",["Cardiac potentials last only about 0.5 ms","Both last about 2 ms","Nerve potentials last 200–300 ms; cardiac cells fire instantly"],"Sustained Ca²⁺ influx holds the cardiac plateau, giving time to contract and preventing tetanus."],
["What separates depolarization from hyperpolarization?","Depolarization makes the inside less negative; hyperpolarization makes it more negative",["Depolarization makes the inside more negative; hyperpolarization makes it positive","Depolarization happens only at rest; hyperpolarization only at the peak","Depolarization is K⁺ efflux; hyperpolarization is Na⁺ influx"],"It is about direction relative to rest: toward zero or positive is depolarizing, further below rest is hyperpolarizing."],
["What are the three sequential phases of an action potential?","Depolarization, repolarization, refractory period",["Resting, activation, deactivation","Influx, outflux, equilibrium","Hyperpolarization, threshold peak, plateau"],"Na⁺ influx depolarizes, K⁺ efflux repolarizes, then channels recover during the refractory period."],
["How do absolute and relative refractory periods differ?","Absolute: no stimulus can fire a spike. Relative: a stronger-than-normal stimulus can",["Absolute = depolarized, relative = hyperpolarized","Absolute applies only to skeletal muscle, relative only to smooth muscle","In the relative period no spike can ever fire"],"In the absolute period (1–3 ms) Na⁺ channels are inactivated. In the relative period they have recovered, but high K⁺ conductance and hyperpolarization demand a bigger stimulus."],
["What does 'all-or-none' mean?","At or above threshold a full-size spike fires; below threshold, nothing",["Amplitude scales with stimulus strength","All ions cross at once or none do","Spikes fire continuously at maximum frequency"],"Once threshold is reached (about 15–20 mV above rest), the spike has a fixed, stereotyped amplitude. Sub-threshold stimuli produce no spike."]
];
const $=s=>document.querySelector(s),N=Q.length;
let order,i,score,streak,res;
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>["intro","quiz","end"].forEach(s=>$("#"+s).classList.toggle("hidden",s!==id));
function pts(){const w=360/N;let p=["0,40"];res.forEach((r,k)=>{const x=k*w;p.push(r?`${x+w*.2},40 ${x+w*.3},4 ${x+w*.45},44 ${x+w*.6},48 ${x+w*.8},40`:`${x+w*.3},46 ${x+w*.6},50 ${x+w*.85},40`)});p.push(360*res.length/N+",40");return p.join(" ")}
function start(){order=sh(Q.map((_,k)=>k));i=0;score=0;streak=0;res=[];show("quiz");render()}
function render(){
  const [q,c,w]=Q[order[i]];
  $("#q").textContent=q;$("#cnt").textContent=`Question ${i+1} of ${N}`;$("#stk").textContent=streak>1?`Streak ×${streak}`:"";
  $("#tr").setAttribute("points",pts());
  const o=$("#opts");o.innerHTML="";
  sh([[c,1],...w.map(t=>[t,0])]).forEach(([t,ok])=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.dataset.ok=ok;b.onclick=()=>pick(b,ok);o.appendChild(b)});
  $("#fb").classList.add("hidden");$("#next").classList.add("hidden");$("#q").focus({preventScroll:true});
}
function pick(b,ok){
  const [,,,e]=Q[order[i]];
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("ok");else if(x!==b)x.classList.add("dim")});
  if(!ok)b.classList.add("bad");
  res.push(!!ok);ok?(score++,streak++):streak=0;
  $("#tr").setAttribute("points",pts());$("#stk").textContent=streak>1?`Streak ×${streak}`:"";
  const f=$("#fb");f.className="fb "+(ok?"ok":"bad");f.innerHTML=`<b>${ok?"Spike! Threshold reached.":"Subthreshold. Not this time."}</b><span></span>`;f.lastChild.textContent=e;
  const n=$("#next");n.textContent=i===N-1?"See my result":"Next question";n.classList.remove("hidden");n.scrollIntoView&&n.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function finish(){
  show("end");$("#tr2").setAttribute("points",pts());$("#sc").textContent=`${score} / ${N}`;
  $("#ti").textContent=score===N?"Full-size spike. All-or-none, and you went all.":score>=9?"Suprathreshold. Nicely done.":score>=6?"Hovering near threshold. One more stimulus.":"Subthreshold. Review the explanations and try again.";
  $("#dots").innerHTML=res.map(r=>`<i class="${r?"o":""}"></i>`).join("");
}
$("#go").onclick=start;$("#again").onclick=start;
$("#next").onclick=()=>{i++;i<N?render():finish()};
</script>
</body>
</html>
