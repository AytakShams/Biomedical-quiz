<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live results — Bioelectricity Quiz</title>
<link rel="stylesheet" href="quiz.css?v=2">
</head>
<body>

<!-- login --------------------------------------------------------------- -->
<main class="wrap" id="login" style="max-width:420px">
  <h1>Live results</h1>
  <p>Lecturer access only.</p>
  <form id="loginForm" autocomplete="off">
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" required>
    <p class="err" id="loginErr" aria-live="polite"></p>
    <button class="btn" type="submit">Open panel</button>
  </form>
</main>

<!-- panel --------------------------------------------------------------- -->
<main class="wrap hidden" id="panel">
  <div class="bar">
    <h1>Live results</h1>
    <select id="session" aria-label="Session"></select>
    <button class="btn ghost" id="toggleOpen" style="width:auto">Close session</button>
    <button class="btn ghost" id="newSession" style="width:auto">New session</button>
    <button class="btn ghost" id="csv" style="width:auto">Export CSV</button>
  </div>

  <div class="cards">
    <div class="cardbox"><b id="cJoined">0</b><span>Joined</span></div>
    <div class="cardbox"><b id="cFinished">0</b><span>Finished</span></div>
    <div class="cardbox"><b id="cAvg">–</b><span>Average best</span></div>
    <div class="cardbox"><b id="cAcc">–</b><span>Class accuracy</span></div>
  </div>

  <div class="bar">
    <input class="grow" id="search" type="search" placeholder="Filter by name…" autocomplete="off">
    <span class="note" id="tick">—</span>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th class="rank">#</th>
        <th data-sort="name">Name</th>
        <th data-sort="best" class="num">Best</th>
        <th data-sort="last" class="num">Last</th>
        <th data-sort="attempts" class="num">Tries</th>
        <th data-sort="answered" class="num">Progress</th>
        <th data-sort="seen">Last seen</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="note" id="empty" style="margin-top:14px"></p>

  <section class="qstats">
    <h2>Which questions did the class miss?</h2>
    <p class="note">Share of correct answers across every attempt in this session. Amber marks the questions worth revisiting.</p>
    <div id="qrows"></div>
  </section>
</main>

<script type="module" src="admin.js?v=2"></script>
</body>
</html>
